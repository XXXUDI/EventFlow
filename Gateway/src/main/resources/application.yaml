spring:
  application:
    name: Gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**
            - id: event-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/events/**
            - id: registration-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/registrations/**

server:
  port: 8080
