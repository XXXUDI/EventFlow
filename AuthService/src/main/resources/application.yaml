spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local} # Make sure to create an application-local.yaml
  application:
    name: AuthService

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/auth_db
    user: postgres
    password: postgres
    locations: classpath:db.migration

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

server:
  port: 8081

security:
  jwt:
    # Override with SECURITY_JWT_SECRET in your environment file (application-local.yaml or application-prod.yaml)
    secret: ${SECURITY_JWT_SECRET}
